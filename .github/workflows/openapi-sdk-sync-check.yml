name: OpenAPI → SDK Sync Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC

permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate SDK snapshot
        run: npm run generate:sdk

      - name: Ensure generated files are committed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Generated SDK files are out of sync with the repository." >&2
            git status --short
            exit 1
          fi
